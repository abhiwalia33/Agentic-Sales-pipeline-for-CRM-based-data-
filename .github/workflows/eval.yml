# Runs the agent eval suite automatically on every push to main, then -
# only if that passes - builds the Docker image and pushes it to GitHub
# Container Registry (ghcr.io).
#
# A "workflow" is a YAML file describing a pipeline of steps GitHub runs
# for you on a fresh virtual machine ("runner") each time. This one now
# has two jobs: `eval` (unchanged - check out the code, install Python,
# install dependencies, run the eval script) and `docker` (new - build +
# push the image). `docker` declares `needs: eval`, which is what makes
# it run only after `eval` succeeds, instead of in parallel with it - if
# `eval` fails, `docker` is skipped entirely, so a broken agent never
# gets published as a "working" image.

name: Eval Agent

on:
  push:
    branches: [main]
  workflow_dispatch: # also allows a manual "Run workflow" button in the GitHub UI

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval suite
        run: python tests/eval_agent.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  docker:
    needs: eval # only starts once the eval job above has succeeded
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is auto-created by GitHub for every workflow run - no
    # secret to set up. By default it only has read access to packages;
    # this grants the write access this job needs to push an image.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided, not a new secret

      - name: Compute image tags
        # Explicit image name, not derived from github.repository: this
        # repo's name ends in a hyphen ("...-based-data-"), and while
        # metadata-action lowercases the name, it does NOT strip a
        # trailing hyphen - producing "...based-data-" as the image ref,
        # which Docker's reference-format parser rejects outright
        # ("invalid reference format"). Hardcoding a valid name here
        # sidesteps that rather than trying to sanitize the repo name at
        # runtime.
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/abhiwalia33/agentic-sales-pipeline-for-crm-based-data
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
